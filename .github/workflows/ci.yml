name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    # `engines` requires node >=22.13, and the test glob only works from 22:
    # the node-20 leg used to fail in seconds, before any test ran.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: fast checks (syntax + packaging rules)
        run: npm run check
      - name: full suite
        run: npm test
      - name: doctor, against an empty state directory
        run: |
          state="$(mktemp -d)"
          if DSH_WEIXIN_STATE_DIR="$state" node bin/doctor.mjs; then
            echo "::error::doctor passed an empty state directory — it should have found problems"
            exit 1
          fi
